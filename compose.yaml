# Everything in one container: the web app on http://<host>:8000/ (am-i-exposed, with the
# wallet tracker on /tracker/), its API, and the database in the volume below.
#   docker compose up -d
# The first start makes a password: docker compose logs, or
#   docker compose exec crypto-tracker cat /data/password
# Settings of the README's table go in an optional .env next to this file.
services:
  crypto-tracker:
    build:
      context: .
      args:
        NEXT_BUILD_CPUS: ${NEXT_BUILD_CPUS:-2} # build workers, about 115 MB each
    image: crypto-tracker
    pull_policy: build # built here, never looked for in a registry
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data

volumes:
  data:
