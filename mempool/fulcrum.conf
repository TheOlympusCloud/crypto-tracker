# Fulcrum, the address index of the `mempool` profile (compose.yaml). Its data dir and TLS
# key come from the image's entrypoint (-D /data -c -k).
bitcoind = bitcoind:8332
rpccookie = /rpc/.cookie
tcp = 0.0.0.0:50001

# It serves this app's mempool only: no talking to other Electrum servers.
peering = false
announce = false
